AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Cuentas Claras - sitio estatico servido desde un bucket S3 privado a traves de
  CloudFront con Origin Access Control. Sin EC2 y sin servidores que administrar.

Parameters:
  NombreProyecto:
    Type: String
    Default: cuentas-claras
    Description: Prefijo para nombrar los recursos.
    AllowedPattern: '^[a-z0-9-]{3,40}$'

  NombreDominio:
    Type: String
    Default: ''
    Description: >
      Dominio propio, por ejemplo cuentasclaras.app. Dejalo vacio para usar solo
      el dominio que asigna CloudFront.

  CertificadoArn:
    Type: String
    Default: ''
    Description: >
      ARN del certificado de ACM para el dominio. DEBE estar emitido en la region
      us-east-1: CloudFront no acepta certificados de ninguna otra region. Dejalo
      vacio si no usas dominio propio.

Conditions:
  # El dominio propio solo se activa si se dan las dos cosas: sin certificado,
  # CloudFront rechazaria el alias.
  UsaDominioPropio: !And
    - !Not [!Equals [!Ref NombreDominio, '']]
    - !Not [!Equals [!Ref CertificadoArn, '']]

Resources:

  # ---------------------------------------------------------------- almacenamiento

  BucketSitio:
    Type: AWS::S3::Bucket
    # El contenido se vuelve a subir con "aws s3 sync", asi que borrar la pila no
    # debe arrastrar datos irrecuperables; aun asi se conserva por precaucion.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${NombreProyecto}-${AWS::AccountId}'
      # El bucket NUNCA es publico: solo CloudFront puede leerlo.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  PoliticaBucket:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketSitio
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SoloEstaDistribucionDeCloudFront
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${BucketSitio.Arn}/*'
            # Sin esta condicion, cualquier distribucion de cualquier cuenta de AWS
            # podria leer el bucket.
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribucion}'

  # ------------------------------------------------------------------- CloudFront

  ControlAccesoOrigen:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${NombreProyecto}-oac'
        Description: Firma las peticiones de CloudFront hacia el bucket privado.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Con bucket privado + OAC, S3 deja de resolver los documentos indice de las
  # subcarpetas: /conversor/ devolveria un 403 en vez de /conversor/index.html.
  # Esta funcion, que corre en el borde antes de buscar en cache, lo arregla.
  FuncionRutas:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${NombreProyecto}-rutas'
      AutoPublish: true
      FunctionConfig:
        Comment: Anade index.html a las rutas de carpeta.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (!uri.includes('.')) {
            // /conversor -> /conversor/index.html
            request.uri = uri + '/index.html';
          }

          return request;
        }

  CabecerasSeguridad:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${NombreProyecto}-cabeceras'
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            Override: true
            # connect-src debe listar TODAS las APIs que consulta el navegador.
            # Si se anade una herramienta con otra fuente de datos y no se agrega
            # aqui, esa herramienta deja de cargar sin error visible en la pagina.
            ContentSecurityPolicy: >-
              default-src 'self';
              script-src 'self' 'unsafe-inline';
              style-src 'self' 'unsafe-inline';
              img-src 'self' data:;
              connect-src 'self' https://ve.dolarapi.com https://criptoya.com https://raw.githubusercontent.com;
              base-uri 'self';
              form-action 'none';
              frame-ancestors 'none'

  Distribucion:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Sitio estatico ${NombreProyecto}'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: !If [UsaDominioPropio, [!Ref NombreDominio], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - UsaDominioPropio
          - AcmCertificateArn: !Ref CertificadoArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

        Origins:
          - Id: origen-s3
            DomainName: !GetAtt BucketSitio.RegionalDomainName
            OriginAccessControlId: !GetAtt ControlAccesoOrigen.Id
            S3OriginConfig:
              OriginAccessIdentity: ''

        DefaultCacheBehavior:
          TargetOriginId: origen-s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          # Politicas gestionadas por AWS (IDs fijos y publicos):
          # CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref CabecerasSeguridad
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FuncionRutas.FunctionMetadata.FunctionARN

        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

Outputs:
  UrlCloudFront:
    Description: URL del sitio (funciona aunque no tengas dominio propio).
    Value: !Sub 'https://${Distribucion.DomainName}'

  NombreBucket:
    Description: Bucket al que se suben los archivos con "aws s3 sync".
    Value: !Ref BucketSitio

  IdDistribucion:
    Description: Necesario para invalidar la cache despues de cada despliegue.
    Value: !Ref Distribucion

  DominioParaDNS:
    Description: Valor al que debe apuntar el registro DNS del dominio propio.
    Value: !GetAtt Distribucion.DomainName
