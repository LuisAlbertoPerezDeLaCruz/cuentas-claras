AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Cuentas Claras - sitio estatico servido desde un bucket S3 privado a traves de
  CloudFront con Origin Access Control. Sin EC2 y sin servidores que administrar.

Parameters:
  NombreProyecto:
    Type: String
    Default: cuentas-claras
    Description: Prefijo para nombrar los recursos.
    AllowedPattern: '^[a-z0-9-]{3,40}$'

  RutaBase:
    Type: String
    Default: cuentas-claras
    Description: >
      Subruta en la que vive el sitio, SIN barras: con "cuentas-claras" el sitio
      queda en https://dominio/cuentas-claras/. Es tambien el prefijo de las
      claves en el bucket, asi que el "aws s3 sync" debe apuntar a ese prefijo.
      OJO: este valor tiene que coincidir con el <base href> del <head> de cada
      pagina de web/. Cambiarlo aqui y no alli deja el sitio sin CSS ni
      JavaScript, y no falla al validar la plantilla: falla en el navegador.
    AllowedPattern: '^[a-z0-9-]{1,60}$'

  NombreDominio:
    Type: String
    Default: ''
    Description: >
      Dominio propio, por ejemplo lapfreelance56.online. Dejalo vacio para usar
      solo el dominio que asigna CloudFront.

  CertificadoArn:
    Type: String
    Default: ''
    Description: >
      ARN del certificado de ACM para el dominio. DEBE estar emitido en la region
      us-east-1: CloudFront no acepta certificados de ninguna otra region. Dejalo
      vacio si no usas dominio propio.

Conditions:
  # El dominio propio solo se activa si se dan las dos cosas: sin certificado,
  # CloudFront rechazaria el alias.
  UsaDominioPropio: !And
    - !Not [!Equals [!Ref NombreDominio, '']]
    - !Not [!Equals [!Ref CertificadoArn, '']]

Resources:

  # ---------------------------------------------------------------- almacenamiento

  BucketSitio:
    Type: AWS::S3::Bucket
    # El contenido se vuelve a subir con "aws s3 sync", asi que borrar la pila no
    # debe arrastrar datos irrecuperables; aun asi se conserva por precaucion.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${NombreProyecto}-${AWS::AccountId}'
      # El bucket NUNCA es publico: solo CloudFront puede leerlo.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  PoliticaBucket:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketSitio
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SoloEstaDistribucionDeCloudFront
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${BucketSitio.Arn}/*'
            # Sin esta condicion, cualquier distribucion de cualquier cuenta de AWS
            # podria leer el bucket.
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribucion}'

  # ------------------------------------------------------------------- CloudFront

  ControlAccesoOrigen:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${NombreProyecto}-oac'
        Description: Firma las peticiones de CloudFront hacia el bucket privado.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Hace dos cosas, las dos obligatorias:
  #
  # 1. Con bucket privado + OAC, S3 deja de resolver los documentos indice de las
  #    subcarpetas: /cuentas-claras/conversor/ devolveria un 403 en vez de la
  #    clave /cuentas-claras/conversor/index.html.
  # 2. Manda la raiz del dominio a la subruta, porque en la raiz del bucket no
  #    hay nada: todas las claves cuelgan del prefijo RutaBase.
  FuncionRutas:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${NombreProyecto}-rutas'
      AutoPublish: true
      FunctionConfig:
        Comment: Redirige la raiz a la subruta y resuelve los index.html.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var base = '/${RutaBase}';

          // La raiz del dominio no tiene contenido propio todavia. 302 y no 301
          // a proposito: el dia que la raiz tenga su propia pagina, un 301 se
          // habria quedado cacheado en los navegadores de los visitantes.
          // ---> QUITAR ESTE BLOQUE cuando la raiz tenga contenido propio. <---
          if (uri === '/' || uri === '/index.html') {
            return redirigir(302, 'Found', base + '/');
          }

          // Sin barra final y sin extension es una carpeta. Se redirige a la
          // forma canonica en vez de reescribir, para no servir la misma pagina
          // en dos URLs distintas; aqui el 301 si es correcto.
          if (!uri.endsWith('/') && !uri.includes('.')) {
            return redirigir(301, 'Moved Permanently', uri + '/');
          }

          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          }

          return request;
        }

        function redirigir(codigo, descripcion, destino) {
          return {
            statusCode: codigo,
            statusDescription: descripcion,
            headers: { location: { value: destino } }
          };
        }

  CabecerasSeguridad:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${NombreProyecto}-cabeceras'
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            Override: true
            # connect-src debe listar TODAS las APIs que consulta el navegador.
            # Si se anade una herramienta con otra fuente de datos y no se agrega
            # aqui, esa herramienta deja de cargar sin error visible en la pagina.
            #
            # manifest-src y worker-src heredarian de default-src 'self', pero van
            # escritos: son el manifiesto de la PWA y el service worker, y si
            # algun dia default-src se cierra, la PWA dejaria de instalarse sin
            # ningun error visible en la pagina.
            #
            # base-uri 'self' NO se puede apretar a 'none': el sitio se sirve en
            # una subruta y cada pagina lleva un <base href="/RutaBase/">. Con
            # 'none' el navegador lo ignora y todas las rutas relativas se
            # resuelven mal, otra vez sin error visible en la pagina.
            ContentSecurityPolicy: >-
              default-src 'self';
              script-src 'self' 'unsafe-inline';
              style-src 'self' 'unsafe-inline';
              img-src 'self' data:;
              connect-src 'self' https://ve.dolarapi.com https://criptoya.com https://raw.githubusercontent.com;
              manifest-src 'self';
              worker-src 'self';
              base-uri 'self';
              form-action 'none';
              frame-ancestors 'none'

  Distribucion:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Sitio estatico ${NombreProyecto}'
        # Sin DefaultRootObject a proposito: en la raiz del bucket no hay ningun
        # index.html (todo cuelga del prefijo RutaBase) y la sustitucion que hace
        # DefaultRootObject ocurre ANTES de la funcion del borde, lo que volveria
        # confuso de que ruta parte la redireccion de la raiz. La funcion resuelve
        # los index.html de todas las rutas, esta incluida.
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: !If [UsaDominioPropio, [!Ref NombreDominio], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - UsaDominioPropio
          - AcmCertificateArn: !Ref CertificadoArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

        Origins:
          - Id: origen-s3
            DomainName: !GetAtt BucketSitio.RegionalDomainName
            OriginAccessControlId: !GetAtt ControlAccesoOrigen.Id
            S3OriginConfig:
              OriginAccessIdentity: ''

        DefaultCacheBehavior:
          TargetOriginId: origen-s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          # Politicas gestionadas por AWS (IDs fijos y publicos):
          # CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref CabecerasSeguridad
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FuncionRutas.FunctionMetadata.FunctionARN

        # La 404 tambien cuelga de la subruta. Da igual a que profundidad se
        # sirva, porque su <base href> es absoluto: sus estilos y enlaces
        # funcionan lo mismo en /cuentas-claras/no-existe/ que en /otra-cosa/.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: !Sub '/${RutaBase}/404.html'
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: !Sub '/${RutaBase}/404.html'
            ErrorCachingMinTTL: 60

Outputs:
  UrlCloudFront:
    Description: URL del sitio (funciona aunque no tengas dominio propio).
    Value: !Sub 'https://${Distribucion.DomainName}/${RutaBase}/'

  NombreBucket:
    Description: Bucket del sitio.
    Value: !Ref BucketSitio

  DestinoSync:
    Description: >
      Destino exacto del "aws s3 sync". Incluye el prefijo de la subruta: subir a
      la raiz del bucket dejaria el sitio en 404.
    Value: !Sub 's3://${BucketSitio}/${RutaBase}'

  IdDistribucion:
    Description: Necesario para invalidar la cache despues de cada despliegue.
    Value: !Ref Distribucion

  DominioParaDNS:
    Description: Valor al que debe apuntar el registro DNS del dominio propio.
    Value: !GetAtt Distribucion.DomainName
